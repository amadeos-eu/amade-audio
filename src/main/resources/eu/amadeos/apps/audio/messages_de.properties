about.text=amade-audio — Audio Station für amadeOS\nAudio-CDs, Musikdateien (MP3, Ogg Vorbis, AAC, FLAC, WAV, MIDI)\nund Internetradio in einem Rack.\n\nTitel von MusicBrainz, Cover aus dem Cover Art Archive,\nSender von radio-browser.info.\n\nLizenziert unter der EUPL-1.2.
